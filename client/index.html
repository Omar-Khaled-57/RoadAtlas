<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoadAtlas</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="description"
      content="RoadAtlas — showcase, follow, track, and revisit technology roadmaps."
    />
    <meta name="theme-color" content="#0a0e27" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RoadAtlas — Technology Roadmaps" />
    <meta
      property="og:description"
      content="Showcase, follow, track, and revisit technology roadmaps."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('roadatlas.theme');
          if (theme !== 'light' && theme !== 'dark' && theme !== 'ocean') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);

          var lang = localStorage.getItem('roadatlas.lang');
          if (lang !== 'en' && lang !== 'ar') {
            lang = (navigator.language || 'en').indexOf('ar') === 0 ? 'ar' : 'en';
          }
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
